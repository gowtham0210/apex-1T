[project]
name = "apex1t"
version = "0.1.0"
description = "Apex-1T: a DeepSeek-V3-style (MLA + sparse MoE) trillion-parameter LLM architecture, defined and structurally validated but not trained."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apex1t"]
